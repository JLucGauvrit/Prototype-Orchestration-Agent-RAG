version: '3.9'

services:
  # Serveur MCP Orchestrateur
  mcp-server:
    build: ./server
    container_name: mcp-server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MCP_TRANSPORT=stdio
    networks:
      - mcpnet

  # Agent A avec connexions MCP Gmail
  agent-a:
    build: ./agent
    container_name: agent-a
    restart: always
    ports:
      - "5001:5000"
    environment:
      - AGENT_NAME=AgentA
      - RAG_PATH=/rag_data/agent_a
      - GMAIL_MCP_ENABLED=true
      - GMAIL_API_KEY=${GMAIL_API_KEY}
    volumes:
      - ./rag_data/agent_a:/rag_data/agent_a
    depends_on:
      - mcp-server
    networks:
      - mcpnet

  # Agent B avec connexions MCP PostgreSQL
  agent-b:
    build: ./agent
    container_name: agent-b
    restart: always
    ports:
      - "5002:5000"
    environment:
      - AGENT_NAME=AgentB
      - RAG_PATH=/rag_data/agent_b
      - POSTGRES_MCP_ENABLED=true
      - POSTGRES_URL=${POSTGRES_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./rag_data/agent_b:/rag_data/agent_b
    depends_on:
      - mcp-server
    networks:
      - mcpnet

  # Agent C hybride (Gmail + PostgreSQL)
  agent-c:
    build: ./agent
    container_name: agent-c
    restart: always
    ports:
      - "5003:5000"
    environment:
      - AGENT_NAME=AgentC
      - RAG_PATH=/rag_data/agent_c
      - GMAIL_MCP_ENABLED=true
      - POSTGRES_MCP_ENABLED=true
      - GMAIL_API_KEY=${GMAIL_API_KEY}
      - POSTGRES_URL=${POSTGRES_URL}
    volumes:
      - ./rag_data/agent_c:/rag_data/agent_c
    depends_on:
      - mcp-server
    networks:
      - mcpnet

  # UI Debug
  ui-server-MCP:
    image: nginx:alpine
    container_name: ui-server-MCP
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./ui-MCP:/usr/share/nginx/html:ro
    depends_on:
      - mcp-server
    networks:
      - mcpnet

networks:
  mcpnet:
    driver: bridge
