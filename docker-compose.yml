version: "3.9"

services:
  # === Interface utilisateur ===
  ui:
    build: ./ui
    container_name: ui
    restart: always
    ports:
      - "8080:8080"
    networks:
      - frontend
    depends_on:
      - orchestrator
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000

  # === Orchestrateur (MCP Client) ===
  orchestrator:
    build: ./mcp/client
    container_name: orchestrator
    restart: always
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
    volumes:
      - ./mcp/server:/app/mcp_server
    environment:
      - PPLX_API_KEY=${PERPLEXITY_API_KEY}
    depends_on:
      - agent-rag-1
      - agent-rag-2

  # === Agent RAG 1 - Machine Learning ===
  agent-rag-1:
    build: ./agents/rag
    container_name: agent-rag-1
    restart: always
    ports:
      - "9001:9000"
    networks:
      - backend
    volumes:
      - ./agents/rag/data/agent-1:/app/data
    environment:
      - AGENT_ID=agent-1
      - DATA_PATH=/app/data

  # === Agent RAG 2 - Programming ===
  agent-rag-2:
    build: ./agents/rag
    container_name: agent-rag-2
    restart: always
    ports:
      - "9002:9000"
    networks:
      - backend
    volumes:
      - ./agents/rag/data/agent-2:/app/data
    environment:
      - AGENT_ID=agent-2
      - DATA_PATH=/app/data

# Pas de volumes persistants nécessaires (fichiers montés directement)

# === Réseaux ===
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
