#version: "3.9"

services:
  # === Interface utilisateur ===
  ui:
    build: ./ui
    container_name: ui
    restart: always
    ports:
      - "8080:8080"
    networks:
      - frontend
    depends_on:
      - orchestrator
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
    develop:
      watch:
        - path: ./ui
          target: /usr/share/nginx/html
          action: sync+restart

  # === Orchestrateur principal (FastAPI) ===
  orchestrator:
    build: ./orchestrator
    container_name: orchestrator
    restart: always
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
    develop:
      watch:
        - path: ./orchestrator
          target: /app
          action: sync+restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MCP_SERVER_URL=http://mcp-server:7000
      - POSTGRES_URL=postgresql://rag_user:rag_pass@postgres:5432/rag_db
    depends_on:
      - mcp-server

  # === Serveur MCP (coordination des clients MCP et agents RAG) ===
  mcp-server:
    build: ./mcp/server
    container_name: mcp-server
    restart: always
    ports:
      - "7000:7000"
    networks:
      - backend
    develop:
      watch:
        - path: ./mcp/server
          target: /app
          action: sync+restart
    environment:
      - BACKEND_NETWORK=backend

  # === Exemple d’un client MCP (peut être dupliqué dynamiquement) ===
  mcp-client-template:
    build: ./mcp/client
    container_name: mcp-client-template
    networks:
      - backend
    volumes:
      - rag_data:/app/data
    environment:
      - MCP_SERVER_URL=http://mcp-server:7000
      - RAG_AGENT_URL=http://agent-rag-template:9000
      - AGENT_ID=template
    depends_on:
      - mcp-server

  # === Exemple d’un agent RAG (un par instance) ===
  agent-rag-template:
    build: ./agents/rag
    container_name: agent-rag-template
    networks:
      - backend
    volumes:
      - rag_data:/app/data
    environment:
      - AGENT_ID=template
      - DATA_PATH=/app/data/agent_template
      - POSTGRES_URL=postgresql://rag_user:rag_pass@postgres:5432/rag_db
    depends_on:
      - postgres
      - mcp-server

  # === Base de données pour stockage vectorisé ===
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    networks:
      - backend
    environment:
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
      - POSTGRES_DB=rag_db
    volumes:
      - pg_data:/var/lib/postgresql/data

# === Volumes persistants ===
volumes:
  rag_data:
  pg_data:

# === Réseaux ===
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
