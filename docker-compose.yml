# RAG Multi-Agent avec MCP - Version Simplifiée
# Architecture: Orchestrateur (MCP Client) → Agents RAG (MCP Servers)

#version: '3.8'

services:
  # PostgreSQL avec pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rag-network

  # Interface utilisateur
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag-ui
    ports:
      - "8080:80"
    develop:
      watch:
        - path: ./ui
          target: /usr/share/nginx/html
          action: sync+restart
    networks:
      - rag-network

  # Orchestrateur - FastAPI + MCP Client
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: rag-orchestrator
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rag_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGENT1_URL=http://agent-1:8001
      - AGENT2_URL=http://agent-2:8002
      - AGENT3_URL=http://agent-3:8003
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./orchestrator:/app
    networks:
      - rag-network




volumes:
  postgres_data:

networks:
  frontend:
    driver: bridge
  rag-network:
    driver: bridge
