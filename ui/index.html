<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Multi-Agent System</title>
    <link href="styles/main.css" rel="stylesheet">
</head>
<body>
    <!-- Barre de navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                RAG Multi-Agent System
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Conteneur d'erreurs -->
        <div id="errorContainer"></div>

        <!-- Formulaire de requête -->
        <form id="queryForm" class="query-card">
            <textarea id="query" 
                      placeholder="Posez votre question ici... (ex: Quelle est la différence entre l'IA générative et l'IA traditionnelle ?)"
                      required></textarea>
            <button id="submitBtn" type="submit" class="button mt-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
                <span>Envoyer</span>
            </button>
        </form>

        <!-- Conteneur des réponses -->
        <div id="response">
            <!-- Les réponses seront insérées ici -->
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
